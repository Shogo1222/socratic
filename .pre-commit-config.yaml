repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --check
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: isort --check-only
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        args:
          - hooks
          - scripts
          - skills
          - tools
      - id: markdownlint
        name: markdownlint
        entry: npm run lint:markdown --
        language: system
        pass_filenames: false
        types: [markdown]
      - id: skill-contract
        name: skill contract
        entry: python3 scripts/check_repository.py
        language: system
        pass_filenames: false
        files: '(^|/)SKILL\.md$|^skills/'
